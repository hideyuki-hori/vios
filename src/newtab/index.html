<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>新しいタブ</title>
<link rel="stylesheet" href="page.css">
</head>
<body>
<main class="card">
<h1>vios</h1>
<section>
<h2>キー</h2>
<dl class="keys">
<dt><code>o</code></dt><dd>オムニバー(タブ / ブックマーク / 履歴 / URL / 検索)</dd>
<dt><code>b</code></dt><dd>ブックマーク</dd>
<dt><code>T</code></dt><dd>タブ切替</dd>
<dt><code>t</code> / <code>x</code></dt><dd>新規タブ / タブを閉じる</dd>
<dt><code>m</code></dt><dd>付箋</dd>
<dt><code>f</code></dt><dd>ヒント</dd>
</dl>
</section>
<section>
<h2>ブロックするサイト</h2>
<p class="hint">ドメイン単位でブロックします(サブドメインを含む)。追加時に該当ドメインの開いているタブは閉じられます</p>
<div class="add-row">
<input id="input" type="text" placeholder="youtube.com" autocomplete="off" aria-label="ブロックするドメイン">
<button id="add" type="button">追加</button>
</div>
<p id="error" class="error"></p>
<ul id="list" class="domain-list"></ul>
</section>
<section>
<h2>vios を無効にするサイト</h2>
<p class="hint">登録したホスト(サブドメインを含む)ではキーバインドが一切効かなくなります。<code>localhost:5173</code> のようにポートを付けるとポートまで一致させます</p>
<div class="add-row">
<input id="disable-input" type="text" placeholder="mail.google.com" autocomplete="off" aria-label="無効にするホスト">
<button id="disable-add" type="button">追加</button>
</div>
<p id="disable-error" class="error"></p>
<ul id="disable-list" class="domain-list"></ul>
</section>
</main>
<script src="content.js"></script>
<script src="newtab.js"></script>
</body>
</html>
